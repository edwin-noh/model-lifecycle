# 폐쇄망 미러링용 oc-mirror v2 입력 파일 (oc apply 대상이 아니다)
#
#   # 인터넷 쪽: 파일로 받기
#   oc mirror -c imageset-config.yaml file://<작업 디렉터리> --v2
#   # 폐쇄망 쪽: 사내 레지스트리에 올리기
#   oc mirror -c imageset-config.yaml --from file://<작업 디렉터리> docker://<사내 레지스트리> --v2
#   # 생성된 IDMS/ITMS/CatalogSource 적용
#   oc apply -f <작업 디렉터리>/working-dir/cluster-resources/
#
# - OCP_VERSION(예: 4.20), 채널은 클러스터에 맞게 바꾼다. 채널은 OperatorHub 가 연결된 클러스터에서 확인:
#     oc get packagemanifest rhods-operator -n openshift-marketplace -o jsonpath='{.status.channels[*].name}'
# - ModelCar 이미지는 미러 대상이 아니다. hf-modelcar --archive 로 만든 oci-archive 를
#   skopeo copy 로 Nexus models-validated / models-community repo 에 직접 올린다
# - vLLM 런타임 이미지는 여기서 받은 뒤, 승인한 것만 skopeo copy 로 Nexus vllm-<등급> repo 에 digest 로 올린다.
#   ServingRuntime 은 Nexus 경로를 직접 참조한다
apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
mirror:
  operators:
    - catalog: registry.redhat.io/redhat/redhat-operator-index:vOCP_VERSION
      packages:
        - name: rhods-operator
          channels:
            - name: RHOAI_CHANNEL
        - name: nfd
    - catalog: registry.redhat.io/redhat/certified-operator-index:vOCP_VERSION
      packages:
        - name: gpu-operator-certified
  additionalImages:
    # vLLM 런타임 후보 이미지 (승인 후 Nexus vllm-ga / vllm-fast 로 복사)
    - name: registry.redhat.io/rhaiis/vllm-cuda-rhel9@sha256:VLLM_DIGEST   # 3.2.4
    # 커뮤니티 vLLM (승인 후 Nexus vllm-upstream 으로 복사)
    - name: docker.io/vllm/vllm-openai@sha256:VLLM_UPSTREAM_DIGEST   # v0.28.0
    # 배포 후 점검용 curl 파드
    - name: registry.access.redhat.com/ubi9/ubi-minimal:latest
