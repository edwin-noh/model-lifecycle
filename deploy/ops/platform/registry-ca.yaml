# 사내 레지스트리(Nexus)가 사설 CA 인증서를 쓰면 노드(kubelet)가 ModelCar/vLLM 이미지를 받을 때 x509 오류가 난다.
# - ConfigMap 키는 레지스트리 호스트, 포트가 있으면 "host..port" (콜론 대신 점 두 개)
# - 호스트와 PEM 은 사이트 값으로 바꾼다. 레지스트리가 여러 개면 키를 더 추가한다
# - image.config.openshift.io/cluster 는 클러스터에 하나뿐인 리소스다.
#   apply 는 여기 적은 필드만 바꾸므로 allowedRegistries 등 기존 설정은 유지된다
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-ca
  namespace: openshift-config
data:
  nexus.internal.example..5000: |
    -----BEGIN CERTIFICATE-----
    (Nexus CA 인증서 PEM)
    -----END CERTIFICATE-----
---
apiVersion: config.openshift.io/v1
kind: Image
metadata:
  name: cluster
spec:
  additionalTrustedCA:
    name: registry-ca
