# RHOAI 사용자 관리 = 이 파일의 Group 멤버십 (Ops팀 관리).
# - 대시보드 접근: RHOAI Auth CR(openshift-cluster-gitops 리포)의 adminGroups 에 kbl-ops-admins,
#   allowedGroups 에 kbl-ai-developers 가 들어 있다
# - 테스트 클러스터는 htpasswd 사용자(ops, ai)를 쓴다. AD 연동 환경이면 이 파일 대신 LDAP 그룹 동기화로 만든다
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: kbl-ops-admins
users:
  - ops
---
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: kbl-ai-developers
users:
  - ai
