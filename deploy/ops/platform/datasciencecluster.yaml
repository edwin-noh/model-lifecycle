# KServe Standard(RawDeployment) 만 사용한다. 3.x 에는 Serverless(Knative)/ModelMesh 설정이 없다.
# 이미 DSC 가 있으면 `oc get dsc -o yaml` 과 합쳐서 적용한다
# (여기에 없는 컴포넌트의 managementState 가 바뀔 수 있다)
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    dashboard:
      managementState: Managed
    kserve:
      managementState: Managed
      # 예측 파드 Service 를 headless 로 만든다 (Headed 도 가능)
      rawDeploymentServiceConfig: Headless
