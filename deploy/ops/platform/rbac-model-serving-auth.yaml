# ISVC 토큰 인증(security.opendatahub.io/enable-auth: "true")용.
# 모델 파드의 kube-rbac-proxy 가 호출자 토큰을 검증(TokenReview)하고 권한을 확인(SubjectAccessReview)할 수 있게 한다.
# 모델 파드 SA(kbl-models/model-serving)에 주는 권한은 이것뿐이다
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # 이름을 <ns>-<sa>-auth-delegator 로 하지 않는다: ODH 컨트롤러가 토큰 인증 ISVC 에 같은 이름의 바인딩을
  # 만들고 ISVC 삭제 시 지운다 (PoC 에서 이름 충돌로 이 리소스가 삭제됨). 컨트롤러가 만들어 주더라도 의존성을 명시해 둔다
  name: kbl-model-serving-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: model-serving
    namespace: kbl-models
