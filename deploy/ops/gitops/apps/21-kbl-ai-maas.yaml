# AI팀 LLMInferenceService (MaaS 대상). AppProject kbl-ai 라 LLMInferenceService/InferenceService 외 리소스는 거부된다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kbl-ai-maas
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: kbl-ai
  source:
    repoURL: https://github.com/edwin-noh/model-lifecycle.git
    targetRevision: test/rhoai-35-home
    path: deploy/ai/maas
  destination:
    server: https://kubernetes.default.svc
    namespace: kbl-maas
  syncPolicy:
    automated:
      selfHeal: true
      prune: true     # 파일을 지우면 모델도 내린다
