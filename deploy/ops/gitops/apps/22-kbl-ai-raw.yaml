# AI팀 KServe InferenceService(RawDeployment) 앱 — deploy/ai/raw
# 현재 활성 서빙 방식 (GPU 1장이라 21-kbl-ai-maas.yaml 은 주석 처리). InferenceService 를 kbl-models 에 만들며 AppProject kbl-ai 로 범위가 제한된다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kbl-ai-raw
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: kbl-ai
  source:
    repoURL: https://github.com/edwin-noh/model-lifecycle.git
    targetRevision: test/rhoai-35-home
    path: deploy/ai/raw
  destination:
    server: https://kubernetes.default.svc
    namespace: kbl-models
  syncPolicy:
    automated:
      selfHeal: true
      prune: true     # 파일을 지우면 모델도 내린다
