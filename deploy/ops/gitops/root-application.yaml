# app-of-apps 루트 (Ops팀이 한 번 oc apply). gitops/apps/ 의 Application 들을 sync-wave 순서로 만든다.
#   wave 0 kbl-ops-platform → wave 1 kbl-ops-kbl-models → wave 2 kbl-ai
# - 앞 wave 의 Application 이 Healthy 가 되어야 다음으로 넘어가려면 Argo CD 에 Application health check 가
#   설정되어 있어야 한다 (ops/README.md 의 ArgoCD CR 설정)
# - appprojects.yaml 은 이 루트보다 먼저 적용한다 (루트가 kbl-ops 프로젝트를 쓴다)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kbl-root
  namespace: openshift-gitops
spec:
  project: kbl-ops
  source:
    repoURL: https://github.com/edwin-noh/model-lifecycle.git
    targetRevision: main
    path: deploy/ops/gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      selfHeal: true
      prune: false    # Application 삭제는 하위 리소스까지 지우므로 직접 한다
