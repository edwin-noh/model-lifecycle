# Argo CD 프로젝트 (OpenShift GitOps 기본 인스턴스, Ops팀이 적용)
# - kbl-ops: Ops팀. 클러스터 설정과 kbl-models 네임스페이스 리소스 전체
# - kbl-ai: AI팀. kbl-models 의 InferenceService, kbl-maas 의 LLMInferenceService 만 동기화할 수 있다.
#   폴더(나중에 리포)에 다른 리소스를 넣어도 Argo CD 가 동기화를 거부한다
# - roles: Argo CD UI/CLI 권한. OpenShift Group 이름으로 매핑한다 (ArgoCD CR 의 전역 RBAC 는 건드리지 않음)
# 리포를 분리하면 sourceRepos 를 각 리포로 바꾼다. 폐쇄망이면 사내 Git 주소로 바꾼다
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kbl-ops
  namespace: openshift-gitops
spec:
  description: Ops팀 - RHOAI 플랫폼 설정과 모델 네임스페이스
  sourceRepos:
    - https://github.com/edwin-noh/model-lifecycle.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  # Git 에 없는 리소스(사람이 대시보드·oc 로 만든 것)를 앱 화면에 경고로 표시한다. 지우지는 않는다.
  # - 대상: 이 프로젝트 앱들의 destination 네임스페이스 (kbl-models, kbl-maas, models-as-a-service, openshift-gitops)
  # - ownerReferences 가 있는 리소스(operator·컨트롤러가 만든 것, 예: playground 의 NetworkPolicy)는 잡히지 않는다
  # - 플랫폼이 자동으로 만드는 것은 ignore 로 뺀다
  orphanedResources:
    warn: true
    ignore:
      - {group: "", kind: ConfigMap, name: kube-root-ca.crt}
      - {group: "", kind: ConfigMap, name: openshift-service-ca.crt}
      - {group: "", kind: ConfigMap, name: config-service-cabundle}
      - {group: "", kind: ConfigMap, name: config-trusted-cabundle}
      - {group: "", kind: ConfigMap, name: odh-trusted-ca-bundle}
      - {group: "", kind: ConfigMap, name: odh-kserve-custom-ca-bundle}
      - {group: "", kind: ServiceAccount, name: builder}
      - {group: "", kind: ServiceAccount, name: default}
      - {group: "", kind: ServiceAccount, name: deployer}
      - {group: "", kind: Secret, name: "*-dockercfg-*"}
      - {group: "", kind: Secret, name: "*-token-*"}
      - {group: rbac.authorization.k8s.io, kind: RoleBinding, name: "system:*"}
      # OpenShift 가 rbac Role/RoleBinding 을 같은 이름으로 한 번 더 보여 주는 API 그룹 (중복 집계 방지)
      - {group: authorization.openshift.io, kind: Role}
      - {group: authorization.openshift.io, kind: RoleBinding}
      # OLM 이 모든 네임스페이스에 복사하는 operator CSV
      - {group: operators.coreos.com, kind: ClusterServiceVersion}
      # GitOps operator 가 managed-by 네임스페이스에 만드는 권한
      - {group: rbac.authorization.k8s.io, kind: Role, name: "openshift-gitops-*"}
      - {group: rbac.authorization.k8s.io, kind: RoleBinding, name: "openshift-gitops-*"}
      # MaaS controller 가 만드는 테넌트 Role
      - {group: rbac.authorization.k8s.io, kind: Role, name: "aitenant-*"}
      # openshift-gitops 네임스페이스: 다른 리포가 관리하는 Application·AppProject, operator 기본 리소스
      - {group: argoproj.io, kind: Application}
      - {group: argoproj.io, kind: AppProject}
      - {group: argoproj.io, kind: NotificationsConfiguration}
      - {group: monitoring.coreos.com, kind: ServiceMonitor, name: "openshift-gitops-*"}
  roles:
    - name: ops
      description: Ops팀 - kbl-ops 앱 전체 권한
      groups:
        - kbl-ops-admins
      policies:
        - p, proj:kbl-ops:ops, applications, *, kbl-ops/*, allow
        - p, proj:kbl-ops:ops, logs, get, kbl-ops/*, allow
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kbl-ai
  namespace: openshift-gitops
spec:
  description: AI팀 - kbl-models 의 InferenceService, kbl-maas 의 LLMInferenceService
  sourceRepos:
    - https://github.com/edwin-noh/model-lifecycle.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kbl-models
    - server: https://kubernetes.default.svc
      namespace: kbl-maas
  clusterResourceWhitelist: []
  # MaaSModelRef / MaaSSubscription / MaaSAuthPolicy / LLMInferenceServiceConfig 는 Ops팀 소유라 허용하지 않는다
  namespaceResourceWhitelist:
    - group: serving.kserve.io
      kind: InferenceService
    - group: serving.kserve.io
      kind: LLMInferenceService
  roles:
    # AI팀은 Git 에 커밋한 뒤 앱을 조회/Sync 만 한다 (앱 설정 변경·삭제 불가). Ops팀도 같은 권한으로 본다
    - name: developers
      description: AI팀 - kbl-ai 앱 조회와 Sync
      groups:
        - kbl-ai-developers
        - kbl-ops-admins
      policies:
        - p, proj:kbl-ai:developers, applications, get, kbl-ai/*, allow
        - p, proj:kbl-ai:developers, applications, sync, kbl-ai/*, allow
        - p, proj:kbl-ai:developers, logs, get, kbl-ai/*, allow
