# llm-d 모델 네임스페이스 격리 (1차). 트래픽: gateway(openshift-ingress) → EPP(scheduler) / vLLM, EPP → vLLM
# - ingress: gateway, 같은 네임스페이스(EPP→vLLM), 모니터링만 허용
# - egress: vLLM 파드만 DNS 외 차단. EPP 는 API 서버를 조회하므로 제외한다
# - EgressFirewall/ANP 는 llm-d 경로를 확인한 뒤 추가 여부를 정한다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-gateway-and-local
  namespace: kbl-maas
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-egress-dns-only
  namespace: kbl-maas
spec:
  podSelector:
    matchLabels:
      kserve.io/component: workload
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
