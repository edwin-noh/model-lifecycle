  annotations:
    opendatahub.io/runtime-version: v0.24.0
    openshift.io/display-name: vLLM 0.24.0 (RHAIIS 3.5.2, GA)
  labels:
    kbl.io/runtime-tier: ga
spec:
  template:
    containers:
      - name: main
        image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:fd9540f3882b9aae5f862eba6c295d0e9c6b43f8c17b27b179481bfa330bfbc1
