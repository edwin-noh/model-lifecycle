# 모델 파드의 egress 를 기본 차단한다. allow-dns 와 network/allow-* 로 허용한 것만 나갈 수 있다.
# Egress 만 지정하므로 ingress(Route, 모니터링 수집)와 요청에 대한 응답은 영향 없다.
# 같은 네임스페이스 허용 정책은 두지 않는다. 등급/출처가 다른 모델이 함께 있으므로 모델 간 통신을 막는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-default-deny-egress
  namespace: kbl-models
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  policyTypes:
    - Egress
