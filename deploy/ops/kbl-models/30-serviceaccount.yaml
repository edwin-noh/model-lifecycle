# 모델 파드용 ServiceAccount. 기본은 토큰을 마운트하지 않는다 (Kubernetes API 조회 불가).
# - ISVC 가 토큰 인증(enable-auth: true)을 켜면 kube-rbac-proxy 가 이 SA 토큰으로 TokenReview/SAR 를 보내므로
#   ISVC 에서 automountServiceAccountToken: true 로 바꾼다. 이 SA 의 권한은 system:auth-delegator 뿐이다
#   (ops/platform/rbac-model-serving-auth.yaml)
# 테스트 클러스터는 public/global pull secret 으로 받으므로 imagePullSecrets 를 두지 않는다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-serving
  namespace: kbl-models
automountServiceAccountToken: false
