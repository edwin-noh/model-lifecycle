# 클러스터 범위 상위 정책 (cluster-admin 전용, 프로젝트 관리자가 수정/삭제 불가)
# 역할: 어떤 NetworkPolicy 를 추가해도 열 수 없는 "바닥선". 세부 허용(어느 모델·어느 호출자)은 NetworkPolicy 가 한다.
#   NetworkPolicy 는 합산(허용이 하나라도 있으면 열림)이고, Git 밖에서 추가된 NetworkPolicy 는 Argo selfHeal 이 지우지 않는다
#   (RHOAI 컨트롤러도 프로젝트에 NetworkPolicy 를 만든다 — model-hub 에서 확인). 그래서 꼭 막아야 할 것은 여기서 Deny 한다.
# - egress: DNS·API 서버만 Allow, 허용 대상은 NetworkPolicy 로 위임(Pass), 나머지 네임스페이스(같은 네임스페이스 포함) Deny
# - ingress: 8080(vLLM 직결, <모델>-metrics Service)은 모니터링·같은 ns 점검 파드 외 Deny. 8443(토큰 인증 프록시)은 NetworkPolicy 가 결정
#   Allow: 최종 허용 (NetworkPolicy 평가 안 함)
#   Pass : NetworkPolicy 에 판단을 넘김 (어느 모델이 쓸 수 있는지는 network/allow-<ns>-<대상>.yaml)
#   Deny : 최종 차단 (NetworkPolicy 로 열 수 없음)
# pass-<ns>-<대상> 규칙 하나가 network/allow-<ns>-<대상>.yaml 하나와 짝이다. 새 대상은 두 곳 모두 추가한다
# (deny-other-namespaces 앞에). 기존 대상에 모델을 추가할 때는 NetworkPolicy 의 목록만 바꾼다.
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: model-isolation-kbl-models
spec:
  # OVN-Kubernetes 는 0~99, 낮을수록 우선
  priority: 50
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kbl-models
      # KServe 가 예측 파드에 붙이는 라벨
      podSelector:
        matchExpressions:
          - key: serving.kserve.io/inferenceservice
            operator: Exists
  ingress:
    # 메트릭 수집 (User Workload Monitoring)
    - name: allow-monitoring-metrics
      action: Allow
      from:
        - namespaces:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - portNumber:
            protocol: TCP
            port: 8080
    # 같은 네임스페이스의 모델이 아닌 파드 (Ops 점검용)
    - name: allow-local-ops-pods-8080
      action: Allow
      from:
        - pods:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kbl-models
            podSelector:
              matchExpressions:
                - key: serving.kserve.io/inferenceservice
                  operator: DoesNotExist
      ports:
        - portNumber:
            protocol: TCP
            port: 8080
    # vLLM 직결 포트는 그 외 어디서도 열 수 없다 (토큰 인증 우회 차단 — PoC 에서 확인된 경로)
    - name: deny-direct-vllm
      action: Deny
      from:
        - namespaces: {}
      ports:
        - portNumber:
            protocol: TCP
            port: 8080
  egress:
    - name: allow-dns
      action: Allow
      to:
        - pods:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: openshift-dns
            podSelector:
              matchLabels:
                dns.operator.openshift.io/daemonset-dns: default
      # 서비스 포트(53)가 아니라 DNS 파드의 실제 포트
      ports:
        - portNumber:
            protocol: UDP
            port: 5353
        - portNumber:
            protocol: TCP
            port: 5353
    # ISVC 토큰 인증(enable-auth: true)의 kube-rbac-proxy 가 TokenReview/SubjectAccessReview 를 보낸다.
    # 파드는 kubernetes Service(172.30.0.1)로 접속하고, OVN 이 모든 master 노드 IP:6443 으로 나눠 보낸다 → master 전부를 연다.
    # IP 대신 control-plane 노드 셀렉터를 쓴다 (master 교체·증설에도 수정 불필요).
    # IP 로 쓰려면 엔드포인트마다 /32 (oc get endpointslice -n default -l kubernetes.io/service-name=kubernetes):
    #   - networks: [192.168.31.230/32, 192.168.31.231/32, 192.168.31.232/32]
    - name: allow-kube-apiserver
      action: Allow
      to:
        - nodes:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      ports:
        - portNumber:
            protocol: TCP
            port: 6443
    # network/allow-rag-system-vector-db.yaml
    - name: pass-rag-system-vector-db
      action: Pass
      to:
        - pods:
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: rag-system
            podSelector:
              matchLabels:
                app: vector-db
      ports:
        - portNumber:
            protocol: TCP
            port: 6333
    # 같은 네임스페이스도 차단한다 (모델 간 통신 금지)
    - name: deny-other-namespaces
      action: Deny
      to:
        - namespaces: {}
