# 모델 파드의 DNS 조회만 허용한다 (31- 의 egress 기본 차단 예외).
# 20-adminnetworkpolicy.yaml 의 allow-dns 와 같은 내용이다. ANP 를 적용하지 않은 환경에서도 동작하도록 NetworkPolicy 에도 둔다
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-allow-dns
  namespace: kbl-models
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      # 서비스 포트(53)가 아니라 DNS 파드의 실제 포트 (NetworkPolicy 는 DNAT 이후에 평가)
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
