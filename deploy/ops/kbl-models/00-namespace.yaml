# 모델 서빙 네임스페이스. 런타임 등급(ga/fast/upstream)과 모델 출처(validated/community)는 네임스페이스가 아니라
# 라벨과 Nexus repo 로 구분한다. 등급을 바꿔도 엔드포인트가 그대로다.
# 모델 전용. 예외로 Gen AI playground(AI팀 admin)만 허용한다. NetworkPolicy(34~36)가 네임스페이스 전체에 적용된다
apiVersion: v1
kind: Namespace
metadata:
  name: kbl-models
  annotations:
    # 같은 Application 의 다른 리소스보다 먼저 만든다
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    # RHOAI 대시보드에 프로젝트로 표시
    opendatahub.io/dashboard: "true"
    # OpenShift GitOps 기본 인스턴스가 이 네임스페이스의 리소스를 관리할 수 있게 한다
    argocd.argoproj.io/managed-by: openshift-gitops
