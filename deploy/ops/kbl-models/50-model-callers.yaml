# 토큰 인증 모델의 호출 권한 (Ops팀 관리) — kbl-models 의 모든 InferenceService 공용 Role
# - kube-rbac-proxy 는 호출자 토큰의 주체가 해당 InferenceService 에 get 권한이 있는지만 확인한다
# - resourceNames 를 두지 않으므로 모델을 추가해도 할 일이 없다
# - 호출자 등록(이 Role 에 대한 RoleBinding + 네트워크 라벨)은 deploy/ops/consumers/<에이전트 ns>.yaml 에서 한다
# - 특정 모델만 일부 호출자에게 막아야 하면 그 모델을 별도 네임스페이스로 분리한다
# - get 권한으로 ISVC 정의(args/env)도 읽을 수 있다. ISVC env 에 비밀값을 넣지 않는다
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-caller
  namespace: kbl-models
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get"]
---
# 같은 네임스페이스의 Gen AI playground 용 호출 신원 (Git 관리)
# AI팀 admin 이 Gen AI studio → AI asset endpoints → Create endpoint 에 모델 주소(https://<모델>-predictor.kbl-models.svc.cluster.local:8443/v1)와
# 아래 Secret 의 token 을 넣는다 (Experimenting with models in the gen AI playground §2.2). 토큰을 바꾸려면 Secret 을 지우면 다시 발급된다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playground-caller
  namespace: kbl-models
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: playground-caller-token
  namespace: kbl-models
  annotations:
    kubernetes.io/service-account.name: playground-caller
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caller-playground
  namespace: kbl-models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-caller
subjects:
  - kind: ServiceAccount
    name: playground-caller
    namespace: kbl-models
