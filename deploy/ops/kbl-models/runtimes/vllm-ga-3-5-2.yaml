# vLLM 런타임 (등급 ga, RHAIIS vllm-cuda-rhel9 3.5.2 = upstream vLLM v0.24.0, RHOAI 3.5.2 기본 템플릿과 같은 이미지). 대시보드의 vllm-cuda-runtime-template 과 같은 형식이다.
# - 이름은 vllm-<등급>-<버전>. ISVC 는 이름으로만 참조하므로 이름만 보고 등급을 알 수 있게 한다
# - 이미지는 승인 후 Nexus vllm-<등급> repo 에 digest 로 반입한 것만 쓴다
# - support-status: ga=supported, fast=limited, upstream=unsupported
# - Ops팀이 관리한다. AI팀은 조회만 하고 ISVC 의 runtime 으로 이름을 참조한다
# - 모델마다 다른 인자(--max-model-len, --tool-call-parser 등)는 여기가 아니라 InferenceService args 에 둔다
# - ModelCar 이미지의 /models 가 /mnt/models 로 연결된다
# - 모든 런타임은 모든 HardwareProfile(gpu-1x, gpu-2x)에서 동작해야 하므로 /dev/shm 을 둔다
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-ga-3-5-2
  namespace: kbl-models
  annotations:
    kbl.io/support-status: supported
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    # upstream vLLM 버전 (RHOAI 기본 템플릿과 같은 표기). 버전 조회: ops/README.md
    opendatahub.io/runtime-version: v0.24.0
    opendatahub.io/template-name: vllm-cuda-runtime-template
    opendatahub.io/template-display-name: vLLM NVIDIA GPU ServingRuntime for KServe
    openshift.io/display-name: vLLM 0.24.0 (RHAIIS 3.5.2, GA)
  labels:
    kbl.io/runtime-tier: ga
    opendatahub.io/dashboard: "true"
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      # 테스트 클러스터: registry.redhat.io 에서 직접 받는다 (클러스터 global pull secret)
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:fd9540f3882b9aae5f862eba6c295d0e9c6b43f8c17b27b179481bfa330bfbc1
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
      # vLLM /health 기준 probe (llm-d 기본 템플릿과 같은 방식, 3.5 문서에 serving runtime probe 가이드는 없음)
      # - startup: 모델 로딩 동안 liveness 가 파드를 죽이지 않게 한다 (10s x 60 = 최대 10분)
      #   큰 모델은 ISVC spec.predictor.model.startupProbe 로 늘린다
      # - readiness: 준비 전/과부하 시 트래픽에서 뺀다
      # - liveness: 엔진이 멈추면(포트만 열린 상태) 재시작한다
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 60
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 10
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
  volumes:
    # 공유 메모리(/dev/shm). 컨테이너 기본값은 64MB 라 tensor parallel(NCCL)에서 부족하다
    # - tmpfs 라 미리 할당되지 않는다. 실제로 쓴 만큼만 파드 메모리 limit 에 포함된다 (TP=1 이면 거의 0)
    # - sizeLimit 은 상한이다 (넘으면 eviction). 3.5 문서 runtime 예시와 같은 2Gi
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
