# NVIDIA GPU Operator ClusterPolicy 중 MIG 관련 필드만 (Server-Side Apply 로 이 필드만 소유한다)
# - mixed: MIG 로 나눈 GPU 는 nvidia.com/mig-<프로파일>, 나누지 않은 GPU 는 nvidia.com/gpu 로 노출된다
# - migManager.config.name: 분할 구성 ConfigMap (10-mig-config.yaml)
# - 테스트 클러스터에서는 ClusterPolicy 를 openshift-cluster-gitops(앱 nvidia-gpu-operator)가 관리하고,
#   그 리포에 같은 내용의 components/.../mig-mixed 가 있다. 두 곳에서 같은 필드를 관리하지 말 것 (README 참고)
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  mig:
    strategy: mixed
  migManager:
    enabled: true
    config:
      name: custom-mig-config
      default: all-disabled
