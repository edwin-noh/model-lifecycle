# MIG 분할 구성 (mig-parted 형식). 노드 라벨 nvidia.com/mig.config=<구성 이름> 으로 노드마다 고른다
# - 프로파일 이름(1g.35gb 등)은 예시다. B300 실물에서 `nvidia-smi mig -lgip` 로 확인해 바꾼다
# - 이 ConfigMap 을 바꾸는 것 자체가 GPU 재분할을 일으킬 수 있다. README 의 변경 절차를 따른다
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-mig-config
  namespace: nvidia-gpu-operator
data:
  config.yaml: |
    version: v1
    mig-configs:
      # MIG 를 쓰지 않음 (ClusterPolicy default)
      all-disabled:
        - devices: all
          mig-enabled: false

      # DGX B300: GPU 0-3 은 MIG, 4-7 은 통 GPU
      dgx-b300-half-mig:
        # GPU 0,1: 작은 조각 7개씩 (소형 모델·임베딩)
        - devices: [0, 1]
          mig-enabled: true
          mig-devices:
            "1g.35gb": 7
        # GPU 2,3: 중간 조각 2개씩 (중형 모델)
        - devices: [2, 3]
          mig-enabled: true
          mig-devices:
            "3g.140gb": 2
        # GPU 4-7: 나누지 않음 (대형 모델, tensor parallel)
        - devices: [4, 5, 6, 7]
          mig-enabled: false
