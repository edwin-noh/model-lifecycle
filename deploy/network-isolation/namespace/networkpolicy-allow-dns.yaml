apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-allow-dns
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      # 서비스 포트(53)가 아니라 DNS 파드의 실제 포트 (NetworkPolicy 는 DNAT 이후에 평가)
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
