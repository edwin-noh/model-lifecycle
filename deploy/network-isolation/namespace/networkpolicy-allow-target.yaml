# 허용할 다른 네임스페이스의 endpoint. overlay 에서 egress 를 패치한다.
# 서비스 이름/포트가 아니라 대상 파드의 라벨과 컨테이너 포트(targetPort)로 지정해야 한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-allow-target
spec:
  podSelector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: TARGET_NAMESPACE
          podSelector:
            matchLabels:
              app: TARGET_APP
      ports:
        - protocol: TCP
          port: 1
