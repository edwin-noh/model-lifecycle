# Qwen/Qwen3-4B-Instruct-2507 (검증 모델, GA 런타임)
# AI팀이 관리한다. 허용되는 필드와 규칙은 deploy/ai/README.md
# - 이미지는 hf-modelcar 로 만들어 Nexus models-<출처> repo 에 push 한다. --push 후 출력되는 digest 를
#   storageUri 에 쓰면 반입 심사한 내용과 정확히 일치시킬 수 있다 (태그는 바뀔 수 있음)
# - 노드(kubelet)가 이미지를 받으므로 파드에 모델 다운로드용 egress 가 필요 없다
# - 등급 승격/변경 시 kbl.io/runtime-tier 와 runtime 을 함께 바꾼다
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3-4b-instruct
  namespace: kbl-models
  annotations:
    openshift.io/display-name: Qwen3-4B-Instruct-2507
    # 모델 카탈로그(CATALOG.md)에 표시된다
    openshift.io/description: "범용 소형 지시 모델. 에이전트 tool calling, RAG 응답 생성"
    serving.kserve.io/deploymentMode: Standard
    # 테스트 클러스터의 기존 프로파일. toleration/nodeSelector 를 webhook 이 넣어 준다
    opendatahub.io/hardware-profile-name: nvidia-gpu-serving
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/model-type: generative
    # 토큰 인증 사이드카는 SA 토큰으로 API 서버를 호출하므로 네트워크 격리와 충돌한다.
    # 인증은 앞단 게이트웨이에서 처리한다 (ops/network-isolation/README.md)
    security.opendatahub.io/enable-auth: "false"
  labels:
    kbl.io/runtime-tier: ga
    kbl.io/model-source: validated
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    # 토큰을 마운트하지 않는 ServiceAccount (ops/kbl-models/30-serviceaccount.yaml)
    serviceAccountName: model-serving
    automountServiceAccountToken: false
    # GPU 가 남지 않으면 RollingUpdate 의 새 파드가 Pending 으로 멈춘다. 기존 파드를 먼저 내린다 (짧은 중단 발생)
    deploymentStrategy:
      type: Recreate
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-ga-3-5-2
      storageUri: oci://quay.io/gunoh/modelcar-qwen3-4b-instruct-2507@sha256:d3b891574f418552f5020b0d424e24180588cd23b5b2f720121cbd76684c5927
      args:
        # 모델 기본 컨텍스트 길이가 크면 KV 캐시가 GPU 메모리에 들어가지 않아 기동에 실패한다
        - --max-model-len=12288
        # 에이전트(function calling)용: OpenAI API 의 tools 요청을 처리한다. 파서는 모델 계열에 맞춘다
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
      env:
        # 런타임/라이브러리의 외부 호출(모델 다운로드, 사용 통계)을 끈다
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        - name: VLLM_NO_USAGE_STATS
          value: "1"
        - name: DO_NOT_TRACK
          value: "1"
      # hardware profile(nvidia-gpu-serving) 범위 안에서 지정한다 (model-hub 의 기존 배포와 같은 값)
      resources:
        limits:
          cpu: "4"
          memory: 8Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
